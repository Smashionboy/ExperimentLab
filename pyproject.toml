[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentlab-ab"
version = "1.6.0"
description = "Reproducible A/B inference and Monte Carlo validation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.15,<2", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "scikit-learn>=1.8,<2"]

[project.scripts]
experimentlab = "experimentlab.cli:main"

[tool.setuptools.packages.find]
include = ["experimentlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
